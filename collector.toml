# tonggeret-dashboard collector config.
#
# Copy to your deploy dir and point `--config` at it. Env overrides:
# `COLLECTOR_LISTEN`, `COLLECTOR_FJALL_DIR`, `COLLECTOR_UPSTREAM`.
#
# Two roles share this file:
#   collector worker collector.toml   # scrape + store + hot API + status
#   collector serve  collector.toml   # read-only UI, proxies the worker
# `collector collector.toml` (no role) stays worker.

# Seconds between scrape passes (targets scraped sequentially).
interval_secs = 15
# Serve address for the dashboard + /metrics + /telemetry/parquet + /api/files.
# In split-process mode set the worker to loopback and the dashboard public,
# e.g. via COLLECTOR_LISTEN=127.0.0.1:8081 / 0.0.0.0:8080.
listen = "0.0.0.0:8080"
# Worker base URL used by the `serve` role to reverse-proxy the hot API and
# `/api/v1/status`. Ignored by `worker`.
upstream = "http://127.0.0.1:8081"
# Prebuilt UI bundle served at `/`.
static_dir = "dist"
# Per-target sample cap per scrape (overflow counted, scrape continues).
max_samples_per_scrape = 5000
# Recent-samples ring backing /api/v1/query_range (drop-oldest past the
# cap; process lifetime only — cold Parquet stays the history of record).
recent_buffer_samples = 20000
# Largest accepted exposition body in bytes.
max_body_bytes = 1048576

[fjall]
dir = "./data/fjall"
cold_dir = "./data/cold"
# Hot age after which keys compact to Parquet (dashboard history depth).
retention_days = 30
# Cold files older than this are purged (must exceed retention_days).
cold_purge_days = 32

[[targets]]
name = "beruang"
url = "http://localhost:8000/metrics"
# Series-name prefixes accepted from this target. `collector_*` is denied
# before the allow check (it is this collector's own series namespace),
# so it must not be listed here. Visitor series
# (`visitors_total`, `unique_visitors_estimate`) are covered by the
# `visitors_`/`unique_` entries: an app without them scrapes fine,
# it simply stores zero visitor rows.
allow = ["http_", "beruang_", "tonggeret_", "visitors_", "unique_"]

[[targets]]
name = "hitung"
url = "https://hitung.rayakala.id/metrics"
# Same defaults: beruang business series + HTTP series flow through;
# this app emits no visitor series, so the dashboard visitor preset
# shows its empty state for this target (expected, not an error).
allow = ["http_", "beruang_", "tonggeret_", "visitors_", "unique_"]

